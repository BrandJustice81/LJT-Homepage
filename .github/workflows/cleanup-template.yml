name: Remove template sample content

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Remove sample collections and template pages
        shell: bash
        run: |
          set -euo pipefail
          rm -f _talks/*.md
          rm -f _teaching/*.md
          rm -f _portfolio/*.md _portfolio/*.html
          rm -f _posts/*.md
          rm -f _drafts/*.md
          rm -f _publications/*.md
          rm -f _pages/talks.html
          rm -f _pages/teaching.html
          rm -f _pages/portfolio.html
          rm -f _pages/year-archive.html
          rm -f _pages/talkmap.html
          rm -f _pages/markdown.md
          rm -f _pages/archive-layout-with-content.md
          rm -f _pages/non-menu-page.md
          rm -f .github/workflows/cleanup-template.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No template sample content remained to remove."
          else
            git commit -m "Remove template sample content"
            git push
          fi
